<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Favourite Shows and Movies</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&display=swap');

    :root {
      --bg: #f8f1e4;
      --bg-soft: #f3e8d6;
      --text: #2e241a;
      --muted: #9c8b6f;
      --accent: #b8860b;
      --accent-soft: #d8b96a;
      --card-bg: #fffdf8;
      --card-border: rgba(184, 134, 11, 0.22);
      --star-empty: #d9cdb9;
      --star-fill: #f5aecb;
      --star-fill-stroke: #e8899f;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: radial-gradient(ellipse at top, var(--bg-soft), var(--bg) 60%);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    header {
      text-align: center;
      padding: 64px 20px 24px;
    }

    header h1 {
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 2.6rem;
      font-weight: 700;
      letter-spacing: 0.3px;
      color: var(--text);
    }

    header p {
      margin: 10px 0 0;
      color: var(--muted);
      font-style: italic;
    }

    header::after {
      content: "";
      display: block;
      width: 80px;
      height: 2px;
      margin: 20px auto 0;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    section { margin-top: 48px; }

    h2 {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 1.35rem;
      margin: 0 0 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--accent);
      display: inline-block;
      color: var(--text);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 24px;
      align-items: start;
    }

    .empty .poster {
      aspect-ratio: 2 / 3;
    }

    .card { margin: 0; }

    .poster {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(184, 134, 11, 0.10);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover .poster {
      transform: translateY(-4px);
      box-shadow: 0 10px 22px rgba(184, 134, 11, 0.22);
    }

    .poster img {
      width: 100%;
      height: auto;
      display: block;
    }

    figcaption {
      margin-top: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      color: var(--text);
    }

    .rank {
      color: var(--accent);
      margin-right: 4px;
    }

    .empty figcaption {
      color: var(--muted);
      font-weight: 400;
    }

    /* Star rating - width-based overlay gives a precise fractional
       fill (e.g. 4.3 shows as 4.3, not rounded to 4.5) */
    .rating {
      position: relative;
      width: fit-content;
      height: 20px;
      margin: 8px auto 0;
    }

    .stars {
      display: flex;
      gap: 4px;
    }

    .stars svg {
      width: 20px;
      height: 20px;
      display: block;
      flex-shrink: 0;
    }

    .stars-empty polygon {
      fill: none;
      stroke: var(--star-empty);
      stroke-width: 1.5;
      stroke-linejoin: round;
    }

    .stars-filled {
      position: absolute;
      top: 0;
      left: 0;
      overflow: hidden;
      white-space: nowrap;
      width: 0%;
    }

    .stars-filled polygon {
      fill: var(--star-fill);
      stroke: var(--star-fill-stroke);
      stroke-width: 1;
      stroke-linejoin: round;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }

    .section-header h2 {
      margin: 0;
    }

    .sort-label {
      font-size: 0.9rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-select {
      font-family: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .sort-select:focus {
      outline: 2px solid var(--accent-soft);
      outline-offset: 1px;
    }

    .watched-grid .card.is-hidden {
      display: none;
    }

    .load-more-wrap {
      text-align: center;
      margin-top: 32px;
    }

    .load-more-btn {
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
      background: var(--card-bg);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 10px 28px;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, box-shadow 0.2s ease;
    }

    .load-more-btn:hover {
      background: var(--accent);
      color: #fffdf8;
      box-shadow: 0 4px 14px rgba(184, 134, 11, 0.3);
    }

    .load-more-btn:disabled {
      display: none;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      header h1 { font-size: 1.9rem; }
    }
  </style>
</head>

  <script>
    document.querySelectorAll('.rating').forEach(function (el) {
      var rating = parseFloat(el.dataset.rating) || 0;
      var clamped = Math.max(0, Math.min(5, rating));
      var pct = (clamped / 5) * 100;
      var fg = el.querySelector('.stars-filled');
      if (fg) fg.style.width = pct + '%';
      el.setAttribute('role', 'img');
      el.setAttribute('aria-label', clamped + ' out of 5 stars');
    });

    // Load more / sort for the "Watched" grids
    var ROWS_INITIAL = 2;
    var ROWS_PER_CLICK = 4;

    document.querySelectorAll('.watched-grid').forEach(function (grid) {
      var section = grid.closest('section');
      var sortSelect = section.querySelector('.sort-select');
      var loadMoreBtn = section.querySelector('.load-more-btn');
      var cards = Array.prototype.slice.call(grid.querySelectorAll('.card'));
      var visibleRows = ROWS_INITIAL;

      function getColumnCount() {
        var style = window.getComputedStyle(grid);
        var cols = style.gridTemplateColumns.split(' ').filter(Boolean);
        return cols.length || 1;
      }

      function cardTitle(card) {
        var fc = card.querySelector('figcaption');
        return fc ? fc.textContent.trim().toLowerCase() : '';
      }

      function cardRating(card) {
        var r = card.querySelector('.rating');
        return r ? parseFloat(r.dataset.rating) || 0 : 0;
      }

      function applySort(mode) {
        var sorted = cards.slice();
        if (mode === 'rating') {
          sorted.sort(function (a, b) {
            var diff = cardRating(b) - cardRating(a);
            return diff !== 0 ? diff : cardTitle(a).localeCompare(cardTitle(b));
          });
        } else {
          sorted.sort(function (a, b) {
            return cardTitle(a).localeCompare(cardTitle(b));
          });
        }
        sorted.forEach(function (card) { grid.appendChild(card); });
        cards = sorted;
      }

      function render() {
        var visibleCount = getColumnCount() * visibleRows;
        cards.forEach(function (card, i) {
          card.classList.toggle('is-hidden', i >= visibleCount);
        });
        if (loadMoreBtn) {
          loadMoreBtn.disabled = visibleCount >= cards.length;
        }
      }

      if (sortSelect) {
        sortSelect.addEventListener('change', function () {
          applySort(sortSelect.value);
          visibleRows = ROWS_INITIAL;
          render();
        });
      }

      if (loadMoreBtn) {
        loadMoreBtn.addEventListener('click', function () {
          visibleRows += ROWS_PER_CLICK;
          render();
        });
      }

      var resizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(render, 150);
      });

      render();
    });
  </script>
