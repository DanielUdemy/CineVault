<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Favourite Shows and Movies</title>
  <style>
    :root {
      --bg: #f6f6f8;
      --text: #1c1c1e;
      --muted: #8a8a8f;
      --accent: #c0392b;
      --card-bg: #e4e4e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.5;
    }

    header {
      text-align: center;
      padding: 64px 20px 24px;
    }

    header h1 {
      margin: 0;
      font-size: 2.4rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    header p {
      margin: 8px 0 0;
      color: var(--muted);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px 80px;
    }

    section { margin-top: 48px; }

    h2 {
      font-size: 1.3rem;
      margin: 0 0 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--accent);
      display: inline-block;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 20px;
      align-items: start;
    }

    .empty .poster {
      aspect-ratio: 2 / 3;
    }

    .card { margin: 0; }

    .poster {
      background: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover .poster {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
    }

    .poster img {
      width: 100%;
      height: auto;
      display: block;
    }

    figcaption {
      margin-top: 10px;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
    }

    .rank {
      color: var(--accent);
      margin-right: 4px;
    }

    .empty figcaption {
      color: var(--muted);
      font-weight: 400;
    }

    @media (max-width: 900px) {
      .grid { grid-template-columns: repeat(3, 1fr); }
    }

    @media (max-width: 560px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
      header h1 { font-size: 1.8rem; }
    }
  </style>
</head>
<body>

  <header>
    <h1>A list of my favourite shows and movies</h1>
    <p>The ones I could watch again and again</p>
  </header>

  <main>

    <section>
      <h2>Top 5 Movies</h2>
      <div class="grid">

        <figure class="card">
          <div class="poster"><img src="./Movie Posters/Gladiator.jpg" alt="Gladiator poster" onerror="this.remove()"></div>
          <figcaption><span class="rank">1.</span> Gladiator</figcaption>
        </figure>

        <figure class="card">
          <div class="poster"><img src="./Movie Posters/TheLastSamurai.jpg" alt="The Last Samurai poster" onerror="this.remove()"></div>
          <figcaption><span class="rank">2.</span> The Last Samurai</figcaption>
        </figure>

        <figure class="card empty">
          <div class="poster"></div>
          <figcaption><span class="rank">3.</span> Coming soon</figcaption>
        </figure>

        <figure class="card empty">
          <div class="poster"></div>
          <figcaption><span class="rank">4.</span> Coming soon</figcaption>
        </figure>

        <figure class="card empty">
          <div class="poster"></div>
          <figcaption><span class="rank">5.</span> Coming soon</figcaption>
        </figure>

      </div>
    </section>

    <section>
      <h2>Top 5 Shows</h2>
      <div class="grid">

        <figure class="card">
          <div class="poster"><img src="./Show Posters/TheExpanse.jpg" alt="The Expanse poster" onerror="this.remove()"></div>
          <figcaption><span class="rank">1.</span> The Expanse</figcaption>
        </figure>

        <figure class="card">
          <div class="poster"><img src="./Show Posters/The100.jpg" alt="The 100 poster" onerror="this.remove()"></div>
          <figcaption><span class="rank">2.</span> The 100</figcaption>
        </figure>

        <figure class="card">
          <div class="poster"><img src="./Show Posters/GameOfThrones.jpg" alt="Game of Thrones poster" onerror="this.remove()"></div>
          <figcaption><span class="rank">3.</span> Game of Thrones</figcaption>
        </figure>

        <figure class="card empty">
          <div class="poster"></div>
          <figcaption><span class="rank">4.</span> Coming soon</figcaption>
        </figure>

        <figure class="card empty">
          <div class="poster"></div>
          <figcaption><span class="rank">5.</span> Coming soon</figcaption>
        </figure>

      </div>
    </section>

  </main>

</body>
</html>
